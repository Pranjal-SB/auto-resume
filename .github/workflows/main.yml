name: Resume

on:
  push:
    branches: [main]
    paths-ignore:
      - 'resume.pdf'
      - 'resume.tex'
      - 'README.md'
  schedule:
    - cron: '0 0 * * 0' # Sundays, midnight UTC
  workflow_dispatch:

# Least privilege: the job only needs to push the regenerated PDF back.
permissions:
  contents: write

concurrency:
  group: resume
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TOKEN: ${{ secrets.TOKEN }}
      LINKEDIN_API_KEY: ${{ secrets.LINKEDIN_API_KEY }} # optional

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Test
        run: go test ./...

      - name: Render resume.tex
        run: go run .

      - name: Cache TinyTeX
        id: tinytex
        uses: actions/cache@v4
        with:
          path: ~/.TinyTeX
          key: ${{ runner.os }}-tinytex-v1

      - name: Install TinyTeX
        if: steps.tinytex.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://yihui.org/tinytex/install-bin-unix.sh" | sh
          export PATH="$HOME/.TinyTeX/bin/x86_64-linux:$PATH"
          tlmgr update --self
          tlmgr install enumitem hyperref xcolor ragged2e parskip

      - name: Compile PDF
        run: |
          export PATH="$HOME/.TinyTeX/bin/x86_64-linux:$PATH"
          pdflatex -interaction=nonstopmode -halt-on-error resume.tex
          test -s resume.pdf

      - name: Commit regenerated resume
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resume.tex resume.pdf
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m 'chore: regenerate resume [skip ci]'
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: resume
          path: |
            resume.pdf
            resume.tex
          if-no-files-found: error
          retention-days: 30
