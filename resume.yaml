projects:
  - name: ExamDB
    repo: examdb
    url: https://examdb.org # private repo — must not link to GitHub
    stack: Python, FastAPI, PostgreSQL, Next.js, Docker
    show_stars: false
    bullets:
      - Built and shipped a searchable database of "194" Indian competitive exams, consolidating dates scattered across dozens of government portals into one source that cites the official page behind every date.
      - Designed a scrape/normalise/dedup/reduce pipeline that preserves conflicting sources and flags the disagreement instead of silently picking a winner, so wrong data stays traceable to the scraper that produced it.
      - Caught a scraper that passed its own tests while emitting "46" rows of a historical archive stamped with the current year, spotted from an impossible 29 FEB entry. Added source-diff validation so a row count is never mistaken for correctness.
      - Built OAuth sign-in storing only SHA-256 digests of opaque session tokens, plus daily scrapers on GitHub Actions and a Next.js frontend. Solo project, live at examdb.org.

  - name: TYPE
    repo: type
    url: https://github.com/Pranjal-SB/type
    stack: Rust, ratatui, LSP, DAP, tree-sitter
    show_stars: false
    bullets:
      - Building a full IDE that runs in the terminal, non-modal with full mouse parity, aimed at the gap between bare terminal editors and heavyweight GUI ones. Published on crates.io as typ-editor, currently "v0.2.10".
      - Wrote LSP, DAP and tree-sitter clients so new language support arrives by protocol instead of per-language code. Holds a "100ms" cold-start and "16ms" p99 keystroke-to-glyph budget.
      - Added an opt-in vim layer that maps modes and operators onto the same named actions the non-modal path already calls, so it owns no editing primitives and the core never depends on it.
      - Made themes a TOML artifact rather than a compile-time constant, detecting terminal colour depth at startup and degrading the palette to 256 colours where required.

  - name: OutN
    repo: OutN
    url: https://github.com/Pranjal-SB/OutN
    stack: Python, discord.py, OpenCV
    show_stars: false
    bullets:
      - Self-hostable FOSS Pokemon recognition and assistant bot for Discord, identifying spawns from images and solving hints automatically; config-driven so users deploy it without writing code.
      - Maintained across "2+ years" and "9 major versions" through repeated breaking changes to the upstream Discord and Poketwo APIs, keeping existing self-hosted deployments working without manual migration.

